name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  collector:
    name: Collector on Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.12', '3.13']
        exclude:
          # Python 3.8 is not available on the macOS arm64 runners.
          - os: macos-latest
            python-version: '3.8'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the collector
        run: python scripts/pysan_collect.py -o report.json --quiet

      - name: Check the report is valid and complete
        shell: python
        run: |
          import json
          import sys

          with open('report.json', encoding='utf-8') as handle:
              report = json.load(handle)

          assert report['schema'] == 'pysan/collector/v2', report['schema']
          assert report['python']['version'], 'no interpreter version recorded'
          assert report['packages'], 'no packages collected'

          for package in report['packages']:
              for key in ('name', 'version', 'size', 'files', 'requires', 'editable'):
                  assert key in package, (key, package)
              assert isinstance(package['requires'], list), package

          measured = sum(1 for p in report['packages'] if p['size'])
          print('collected %d packages, %d measured' % (len(report['packages']), measured))
          assert measured, 'no package sizes were measured'

      - name: Check the flags behave
        run: |
          python scripts/pysan_collect.py --no-sizes --indent 0 --quiet -o compact.json
          python scripts/pysan_collect.py --quiet > stdout.json
          python -c "import json; json.load(open('compact.json')); json.load(open('stdout.json'))"
