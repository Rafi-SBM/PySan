<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>PySan - Python environment analyzer</title>
    <meta
      name="description"
      content="Measure every package in a Python environment, find what nothing you use depends on, and get safe uninstall commands. Runs entirely in your browser."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0f16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PySan - Python environment analyzer" />
    <meta
      property="og:description"
      content="Find the bloat in a Python environment without breaking it. Dependency-checked removal recommendations, generated in your browser."
    />
    <meta name="twitter:card" content="summary" />

    <script>
      // Applied before first paint so the correct theme renders immediately.
      (function () {
        try {
          var stored = localStorage.getItem('pysan.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #e8edf5;">
        <h1>PySan needs JavaScript</h1>
        <p>
          All of the analysis runs in your browser, so there is no server-rendered version.
          Enable JavaScript to use PySan.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
